<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #stage { width: 1024px; height: 1024px; display: flex; align-items: center; justify-content: center; }
</style></head>
<body>
<div id="stage"></div>
<script>
// BetKeeper badge: a sports shield with a keyhole. Navy / neon lime / sky blue.
const NAVY = '#061733', CARD = '#0D2650', LIME = '#7BEA2B', LIME_HI = '#A6F55F', SKY = '#3CC4FF';
function badge({ bg = null, scale = 0.8, mono = false } = {}) {
  const lime = mono ? '#FFFFFF' : LIME, limeHi = mono ? '#FFFFFF' : LIME_HI, sky = mono ? '#FFFFFF' : SKY;
  const hole = mono ? 'transparent' : NAVY, fillOuter = mono ? 'transparent' : CARD;
  const s = 210 * (1 / scale), off = (s - 210) / 2;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="${-off} ${-off} ${s} ${s}">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${limeHi}"/><stop offset="1" stop-color="${lime}"/></linearGradient>
      <mask id="m"><rect x="-500" y="-500" width="1500" height="1500" fill="white"/>
        <circle cx="105" cy="92" r="20" fill="black"/><path d="M96 104 h18 l7 40 h-32z" fill="black"/></mask></defs>
    ${bg ? `<rect x="${-off}" y="${-off}" width="${s}" height="${s}" fill="${bg}"/>` : ''}
    <path d="M105 10 l80 28 v62 c0 52 -36 86 -80 100 c-44 -14 -80 -48 -80 -100 v-62z" fill="${fillOuter}" stroke="${lime}" stroke-width="9" stroke-linejoin="round"/>
    <path d="M105 32 l60 21 v47 c0 40 -27 66 -60 77 c-33 -11 -60 -37 -60 -77 v-47z" fill="url(#g)" mask="url(#m)"/>
    ${mono ? '' : `<circle cx="105" cy="92" r="20" fill="${hole}"/><path d="M96 104 h18 l7 40 h-32z" fill="${hole}"/>`}
  </svg>`;
}
window.render = (opts) => { document.getElementById('stage').innerHTML = badge(opts); };
</script>
</body></html>
