<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <!-- Home-screen app support (iPhone "Add to Home Screen" + Android install) -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BetKeyper" />
    <meta name="description" content="Every ticket. Every book. One place. Track every bet from every sportsbook for free." />
    <meta name="theme-color" content="#061733" />
    <!-- Link previews (iMessage, social) -->
    <meta property="og:site_name" content="BetKeyper" />
    <meta property="og:title" content="BetKeyper: Keep all your bets in one spot" />
    <meta property="og:description" content="Try it free. Snap any ticket from any book, sweat it live and see your real record." />
    <meta property="og:image" content="https://jamesfaucett33.github.io/Bet-tracker-app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BetKeyper: Keep all your bets in one spot. Try it free." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jamesfaucett33.github.io/Bet-tracker-app/og-image.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #061733;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
